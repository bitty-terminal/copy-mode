# Bitty plugin manifest for Copy mode (bitty-terminal.copy-mode).
#
# W-135 S-3 (CTX-0003) public-API policy package over the accepted
# search-selection contract (bitty-terminal-docs b0514e6, PR #187), W-131
# (bitty-docs 21d63dc), W-137 (bitty-plugins-docs 002c7ce), and RFC-0004
# (bitty-docs adbb787, PR #434, W-139 successor). The plugin consumes exactly
# two additive v2 capabilities and no private surface:
# `history.transcript.read` (bounded, scoped snapshot queries over
# already-persisted, already-redacted transcript history through
# `bitty.history.transcript.query` with `op` list/tail/search) and
# `clipboard.write` (selection export through `bitty.selection.copy` behind
# the Core clipboard permission gate and the 8192-byte bound, per W-143).
# The history grant authorizes delivery into the plugin VM only; export needs
# its own separately granted authority, declared here under its own review.
# The plugin requests no commands history, no KV, no filesystem,
# process-spawn, network, overlay, or terminal authority: it never reads
# `bitty.terminal.*`, never subscribes to streaming events, and never
# executes or interpolates the untrusted record bodies it selects.
#
# `just manifest` validates this file with the authoritative `bitty-plugin-lint`
# from bitty-plugin-sdk (merged W-139 surface, SDK CTX-0066 PR #144 at
# d915535), pinned by commit in `package.json` and `bun.lock`. Run
# `just install` once to materialize it.

[plugin]
id = "bitty-terminal.copy-mode"
name = "Copy mode"
version = "0.0.1"
description = "Modal visual-selection policy over the public history snapshot API: bounded scoped transcript queries with typed denials, untrusted labels, anchor/cursor selection over the cached page, and grant-gated yank. Presentation state only; never mutates Terminal Truth."
license = "MIT"

[compat]
# Application and Plugin API ranges. Both are syntax-validated here and
# resolved by the host at install time. The host validates compatibility
# before activation and fails closed (disable with a diagnostic, no partial
# activation) on mismatch.
bitty = ">=0.5,<1.0"
plugin-api = "^1.0"

[capabilities]
# Deny by default; each capability is requested one by one. This is the exact
# minimal set the copy-mode policy needs; nothing else is declared or used.
# - history.transcript.read: bounded snapshot queries (`list`/`tail`/`search`)
#   over already-persisted transcript history, always with an explicit
#   panel/workspace scope, explicit row/byte bounds, opt-in capture, typed
#   denials, and the Core-attached untrusted label (RFC-0004, W-139).
# - clipboard.write: selection export through `bitty.selection.copy` only,
#   behind the Core clipboard permission gate with the 8192-byte bound and
#   the `truncated` flag (W-143 reuses this existing grant; no new
#   capability). No other export path exists: no files, no processes, no
#   network, no second write surface.
history.transcript.read = true
clipboard.write = true

[lazy]
# Static triggers let the host register the plugin without creating a VM.
# Commands are plugin-qualified: `<plugin-id>:<resource>`. `open` runs one
# bounded snapshot query and enters visual selection; `move` steps the visual
# cursor over the cached page; `anchor` restarts the selection at the cursor;
# `yank` exports the selected span behind the clipboard grant; `close` drops
# the page and leaves visual selection. No event subscriptions: the plugin
# never streams and never observes the Event Bus.
commands = [
  "bitty-terminal.copy-mode:open",
  "bitty-terminal.copy-mode:move",
  "bitty-terminal.copy-mode:anchor",
  "bitty-terminal.copy-mode:yank",
  "bitty-terminal.copy-mode:close",
]
